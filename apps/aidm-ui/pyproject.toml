[project]
name = "aidm-ui"
version = "0.1.0"
description = "NiceGUI application for AIDM"
requires-python = ">=3.12"
dependencies = [
    "aidm-core",
    "aidm-rules-5e",
    "aidm-rules-story",
    "nicegui>=2.0",
    "pydantic>=2.9",
]

[project.scripts]
aidm = "aidm_ui.app:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidm_ui"]
