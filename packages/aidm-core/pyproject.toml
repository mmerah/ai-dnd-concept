[project]
name = "aidm-core"
version = "0.1.0"
description = "Engine-neutral core for AIDM"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-ai-slim[openai]>=1.0",
    "pydantic-settings>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidm"]
