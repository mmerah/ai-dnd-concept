[project]
name = "aidm-rules-5e"
version = "0.1.0"
description = "D&D 5e rules engine for AIDM"
requires-python = ">=3.12"
dependencies = [
    "aidm-core",
    "pydantic>=2.9",
    "pydantic-ai-slim>=1.0",
    "pydantic-settings>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidm_5e"]
