[project]
name = "aidm"
version = "0.1.0"
description = "AI Dungeon Master"
requires-python = ">=3.12"
dependencies = [
    "nicegui>=2.0",
    "pydantic>=2.9",
    "pydantic-ai-slim[openai]>=1.0",
    "pydantic-settings>=2.5",
]

[project.scripts]
aidm = "aidm.ui.app:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidm"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
pythonpath = ["tests/core", "tests/story", "tests/dnd5e", "tests/ui"]
testpaths = ["tests"]

[tool.basedpyright]
include = ["src", "tests", "scripts"]
extraPaths = [
  "src",
  "tests/core",
  "tests/story",
  "tests/dnd5e",
  "tests/ui",
  "scripts",
  "scripts/evals",
]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
reportUnusedCallResult = false # NiceGUI's builder API returns elements by design
reportUnannotatedClassAttribute = false # pydantic's `model_config` is unannotated

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
