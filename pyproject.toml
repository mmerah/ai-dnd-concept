[project]
name = "aidm"
version = "0.1.0"
description = "AI Dungeon Master"
requires-python = ">=3.13"
dependencies = [
    "nicegui==3.16.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "httpx==0.28.1",
    "pypdf==6.16.2",
    "mcp==2.0.0",
]

[project.scripts]
aidm = "aidm.ui.app:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidm"]

[dependency-groups]
dev = [
    "basedpyright==1.39.10",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.4",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
pythonpath = ["tests/core", "tests/breathless", "tests/loner3e", "tests/tunnelgoons", "tests/ui", "tests/twentyfourxx"]
testpaths = ["tests"]

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["src", "tests/core", "tests/breathless", "tests/loner3e", "tests/tunnelgoons", "tests/ui", "tests/twentyfourxx"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
reportUnusedCallResult = false # NiceGUI's builder API returns elements by design
reportUnannotatedClassAttribute = false # pydantic's `model_config` is unannotated

[tool.ruff]
line-length = 100
extend-exclude = [".agents", "NEXT-SPECS.md", "PLAN.md"] # ruff 0.16 formats md code blocks

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
